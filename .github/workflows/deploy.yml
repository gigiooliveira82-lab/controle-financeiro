name: Deploy Contas Claras DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            # 1. Configurar diretório seguro e alinhar com o Git
            git config --global --add safe.directory /var/www/contasclaras
            cd /var/www/contasclaras
            git fetch origin main
            git reset --hard origin/main
            git pull origin main

            # 2. Atualizar e reiniciar o Backend
            cd /var/www/contasclaras/backend
            npm install
            pm2 restart contasclaras-backend

            # 3. Recompilar o Frontend
            cd /var/www/contasclaras/frontend
            npm install
            npm run build

            # 4. Atualizar permissões e recarregar Nginx
            chown -R www-data:www-data /var/www/contasclaras
            chmod -R 755 /var/www/contasclaras
            systemctl reload nginx
