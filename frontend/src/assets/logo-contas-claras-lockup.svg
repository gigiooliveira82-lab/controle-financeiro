<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="Contas Claras — Inteligência Financeira">
  <defs>
    <linearGradient id="lk-brain" x1="10" y1="100" x2="100" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F6B4F"/>
      <stop offset="0.45" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#D9C48A"/>
    </linearGradient>
    <linearGradient id="lk-arrow" x1="14" y1="92" x2="104" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F6B4F"/>
      <stop offset="0.5" stop-color="#8FF2C8"/>
      <stop offset="1" stop-color="#EBD9A6"/>
    </linearGradient>
    <filter id="lk-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="520" height="160" rx="16" fill="#0A0F0D"/>

  <g transform="translate(20 20) scale(1)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="url(#lk-brain)" stroke-width="6.5" opacity="0.95">
        <path d="M60 24C50 15 34 17 30 29 19 31 13 42 18 52 9 60 11 75 22 81 25 93 39 99 50 94"/>
        <path d="M60 24c9-8 24-6 28 6 10 3 15 14 10 24"/>
        <path d="M60 24v72"/>
        <path d="M30 29c7 2 10 8 9 14" opacity="0.75"/>
        <path d="M18 52c8-2 14 2 16 8" opacity="0.75"/>
        <path d="M22 81c6-5 14-5 19 1" opacity="0.75"/>
        <path d="M88 30c-7 3-11 9-10 16" opacity="0.75"/>
      </g>
      <path d="M13 88C35 88 39 54 58 54s21-20 44-34" stroke="url(#lk-arrow)" stroke-width="10"/>
      <path d="M84 18h20v20" stroke="url(#lk-arrow)" stroke-width="10"/>
    </g>
  </g>

  <g filter="url(#lk-glow)">
    <text x="152" y="63" fill="#7DF0C0"
          font-family="'Archivo Black','Anton','Inter',system-ui,sans-serif"
          font-weight="900" font-size="40" letter-spacing="0.5">CONTAS</text>
    <text x="152" y="104" fill="#7DF0C0"
          font-family="'Archivo Black','Anton','Inter',system-ui,sans-serif"
          font-weight="900" font-size="40" letter-spacing="0.5">CLARAS</text>
  </g>
  <text x="154" y="130" fill="#9BB3A8"
        font-family="'Inter',system-ui,sans-serif"
        font-weight="500" font-size="17" letter-spacing="0.4">Inteligência Financeira</text>
</svg>
