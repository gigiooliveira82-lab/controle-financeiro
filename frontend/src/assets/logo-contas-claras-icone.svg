<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Contas Claras">
  <defs>
    <linearGradient id="cc-glyph" x1="8" y1="88" x2="92" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F6B4F"/>
      <stop offset="0.55" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#D9C48A"/>
    </linearGradient>
  </defs>

  <!-- silhueta mínima do cérebro: um único contorno fechado, sem dobras internas -->
  <path d="M46 14C34 8 20 16 20 28c-9 3-13 14-6 22-6 8-2 19 8 22
           2 9 12 15 21 12"
        fill="none" stroke="url(#cc-glyph)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- seta ascendente: o elemento que carrega a marca em miniatura -->
  <path d="M12 82C30 82 34 52 50 52s16-16 36-30"
        fill="none" stroke="url(#cc-glyph)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 16h16v16" fill="none" stroke="url(#cc-glyph)"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
