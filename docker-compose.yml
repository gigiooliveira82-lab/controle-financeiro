version: '3.8'

services:
  # ── Backend Node.js / Express ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contas_claras_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - contas_claras_net

  # ── Frontend React / Vite (Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    container_name: contas_claras_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - contas_claras_net

networks:
  contas_claras_net:
    driver: bridge
